# nginx dentro do container. O nginx do host trata do HTTPS e encaminha para aqui.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Os add_header de um location substituem os do server, por isso os
    # cabeçalhos de segurança estão num ficheiro incluído em cada bloco.
    include /etc/nginx/conf.d/security-headers.inc;

    location /_expo/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
